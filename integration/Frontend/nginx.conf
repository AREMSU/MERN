server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/product  ->  http://backend:8000/product
    # "backend" is the compose service name / the Kubernetes service name
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router: any other path serves index.html so refresh and direct links work
    location / {
        try_files $uri /index.html;
    }
}
