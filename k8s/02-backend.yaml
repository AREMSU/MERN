apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: YOUR_DOCKERHUB_USERNAME/shop-backend:v1
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: DB_URL
              value: mongodb://mongo:27017/shop
          # JWT_SECRET, ADMIN_EMAIL and ADMIN_PASSWORD come from the "shop-secret" secret
          envFrom:
            - secretRef:
                name: shop-secret
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
# ClusterIP service: nginx in the frontend pods calls it as "backend"
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
