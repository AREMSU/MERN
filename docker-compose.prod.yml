# used on the EC2 server. the images are built on the server from the copied source,
# JWT_SECRET and ADMIN_* are written into .env by the pipeline.
services:
  mongo:
    image: mongo:7
    container_name: shop-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: ./Express
    image: shop-backend
    container_name: shop-backend
    environment:
      - PORT=8000
      - DB_URL=mongodb://mongo:27017/shop
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET missing}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@store.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD missing}
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build: ./integration/Frontend
    image: shop-frontend
    container_name: shop-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
