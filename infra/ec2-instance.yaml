AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 instance with Docker for the shop (key pair, security group, instance)

Parameters:
  InstanceType:
    Type: String
    Default: t2.micro
    Description: EC2 instance size
  SSHLocation:
    Type: String
    Default: 0.0.0.0/0
    Description: Who may SSH in. Open because GitHub runners have no fixed IP, fine for a sandbox.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  # the private key is stored by AWS in SSM Parameter Store, the pipeline reads it from there
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub "${AWS::StackName}-key"

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH and HTTP for the shop
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPair
      SecurityGroupIds:
        - !GetAtt SecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-server"
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # small swap file, a 1 GB instance running MongoDB + Node + nginx is tight
          fallocate -l 1G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab

          dnf install -y docker
          systemctl enable --now docker
          usermod -aG docker ec2-user

          # docker compose plugin
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          mkdir -p /home/ec2-user/shop
          chown ec2-user:ec2-user /home/ec2-user/shop
          # the pipeline waits for this file
          touch /home/ec2-user/docker-ready

Outputs:
  PublicIp:
    Description: Open this address in the browser
    Value: !GetAtt Instance.PublicIp
  KeyPairId:
    Description: Used by the pipeline to fetch the private key from SSM
    Value: !GetAtt KeyPair.KeyPairId
