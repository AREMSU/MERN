name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1   # must be a region your AWS account is allowed to use
  STACK_NAME: shop-stack

permissions:
  contents: read

jobs:
  # ---------- CI: check the code, build the images, push them to Docker Hub ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend - install and syntax check
        working-directory: Express
        run: |
          npm ci
          find . -name node_modules -prune -o -name '*.js' -print | xargs -n1 node --check

      - name: Frontend - install, lint and build
        working-directory: integration/Frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: Express
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: integration/Frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ---------- CD: create the server once, then update the containers on it ----------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}   # only needed for temporary (lab) credentials
          aws-region: ${{ env.AWS_REGION }}

      - name: CloudFormation deploy (EC2 + Docker, created once)
        run: |
          aws cloudformation deploy \
            --template-file infra/ec2-instance.yaml \
            --stack-name "$STACK_NAME" \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        run: |
          IP=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='PublicIp'].OutputValue" --output text)
          KEY_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='KeyPairId'].OutputValue" --output text)
          echo "SERVER_IP=$IP" >> "$GITHUB_ENV"
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"

      - name: Get the SSH key from SSM
        run: |
          aws ssm get-parameter --name "/ec2/keypair/$KEY_ID" --with-decryption \
            --query Parameter.Value --output text > key.pem
          chmod 600 key.pem

      - name: Wait for the server (SSH and Docker ready)
        run: |
          for i in $(seq 1 40); do
            if ssh -i key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=5 ec2-user@"$SERVER_IP" \
                 'test -f /home/ec2-user/docker-ready && docker compose version' >/dev/null 2>&1; then
              echo "server is ready"; exit 0
            fi
            echo "waiting for the server ($i/40)..."; sleep 15
          done
          echo "server did not become ready in time"; exit 1

      - name: Copy compose file and write .env on the server
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SSH="ssh -i key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ec2-user@$SERVER_IP"
          scp -i key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            docker-compose.prod.yml ec2-user@"$SERVER_IP":shop/docker-compose.yml
          printf 'DOCKERHUB_USER=%s\nIMAGE_TAG=%s\nJWT_SECRET=%s\nADMIN_EMAIL=%s\nADMIN_PASSWORD=%s\n' \
            "$DOCKERHUB_USER" "$IMAGE_TAG" "$JWT_SECRET" "${ADMIN_EMAIL:-admin@store.com}" "$ADMIN_PASSWORD" \
            | $SSH 'cat > shop/.env && chmod 600 shop/.env'

      - name: Pull the new images and restart
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ec2-user@"$SERVER_IP" '
            cd shop &&
            docker compose pull &&
            docker compose up -d &&
            sleep 10 &&
            docker compose exec -T backend node seed.js &&
            docker image prune -f
          '

      - name: Check the site is live
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://$SERVER_IP/" >/dev/null && curl -fsS "http://$SERVER_IP/api/product" >/dev/null; then
              echo "site is live: http://$SERVER_IP"; exit 0
            fi
            sleep 5
          done
          echo "site did not respond"; exit 1
